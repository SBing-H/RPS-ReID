MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '../model/vit_base_ics_cfs_lup.pth'
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on' # V1: off; V2: off
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  STEM_CONV: True
  DROP_PATH: 0.1 # V1: 0.1 default; V2: 0.1 default
  DROP_OUT: 0.05 # V1: 0.0 default; V2: 0.0 default
  ATT_DROP_RATE: 0.0 # V1: 0.0 default; V2: 0.0 default
  DROPOUT_RATE: 0.1 # V1: 0.0 default; V2: 0.0 default
  DUAL_BRANCH: False
  NGTSE: False

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('rgbnt201_rgb')
  ROOT_DIR: ('../data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

DISTILL:
  ENABLED: False

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 60 # V1: 120; V2: 60
  BASE_LR: 0.0003 # V1: 0.0004; V2: 0.0003
  WARMUP_EPOCHS: 20 # V1: 20; V2: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5 # V1: 10; V2: 5
  LOG_PERIOD: 50
  EVAL_PERIOD: 5 # V1: 10; V2: 5
  WEIGHT_DECAY:  2e-4 # V1: 1e-4; V2: 1e-4
  WEIGHT_DECAY_BIAS: 2e-4 # V1: 1e-4; V2: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: '../log/transreid/rgbnt201/vit_base_ics_rgb_V3'
