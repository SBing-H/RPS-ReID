MODEL:
  PRETRAIN_CHOICE: 'finetune' # V18 change: start from V12 best Rank-1 checkpoint.
  PRETRAIN_PATH: '../log/transreid/rgbnt201/vit_base_ics_rgb_srd_dual_ngtse_V12/transformer_120.pth'
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  STEM_CONV: True
  EXTRA_DROP_PATH: False
  DUAL_BRANCH: True
  NGTSE: True
  NGTSE_MODE: 'token'
  NGTSE_LAYERS: [11]
  NGTSE_KERNEL: 5
  NGTSE_BETA: 0.25
  NGTSE_GATE_TYPE: 'q'
  NGTSE_DETACH_GATE: True
  NGTSE_RESIDUAL_GATE: True
  NGTSE_WEIGHTED_STRUCTURE: True

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.45 # V18 change: return to V12 augmentation; V17 0.5 was too disruptive for finetuning.
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('rgbnt201_rgb')
  ROOT_DIR: ('../data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

DISTILL:
  ENABLED: True
  DARK_ROOT: '../data/Syn_dark_market_msmt_v3'
  GT_ROOT: '../data/Syn_dark_market_msmt_v3_GT'
  TEACHER_WEIGHT: '../log/transreid/srd_teacher/vit_base_ics_gt/transformer_best.pth'
  LAMBDA_KD: 0.02
  ALPHA: 1.0
  BETA: 0.8
  TEMPERATURE: 4.0
  AUX_LOSS_WEIGHT: 0.8 # V18 change: reduce aux pull during finetuning; V17 aux loss dominated the update.

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 15 # V18 change: shorter finetune, stop as soon as eval improves.
  BASE_LR: 0.000005 # V18 change: lower than V17 0.00001 to avoid damaging the V12 checkpoint.
  WARMUP_EPOCHS: 1
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 1
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: '../log/transreid/rgbnt201/vit_base_ics_rgb_srd_dual_ngtse_V18'
