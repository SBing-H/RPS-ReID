MODEL:
  PRETRAIN_CHOICE: 'finetune' # V22 change: initialize from V12 best-mAP checkpoint, then learn local part branch.
  PRETRAIN_PATH: '../log/transreid/rgbnt201/vit_base_ics_rgb_srd_dual_ngtse_V12/transformer_50.pth'
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  STEM_CONV: True
  EXTRA_DROP_PATH: False
  DUAL_BRANCH: True
  DUAL_LOCAL: True # V22 change: add local part feature on top of the V12 initialized dual model.
  DEVIDE_LENGTH: 4
  RE_ARRANGE: False # V22 change: semantic horizontal split; safer for finetuning from V12.
  SHIFT_NUM: 5
  SHUFFLE_GROUP: 2
  NGTSE: True
  NGTSE_MODE: 'token'
  NGTSE_LAYERS: [11]
  NGTSE_KERNEL: 5
  NGTSE_BETA: 0.25
  NGTSE_GATE_TYPE: 'q'
  NGTSE_DETACH_GATE: True
  NGTSE_RESIDUAL_GATE: True
  NGTSE_WEIGHTED_STRUCTURE: True

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.4 # V22 change: slightly reduce random erasing during finetune to protect V12 feature.
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('rgbnt201_rgb')
  ROOT_DIR: ('../data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

DISTILL:
  ENABLED: True
  DARK_ROOT: '../data/Syn_dark_market_msmt_v3'
  GT_ROOT: '../data/Syn_dark_market_msmt_v3_GT'
  TEACHER_WEIGHT: '../log/transreid/srd_teacher/vit_base_ics_gt/transformer_best.pth'
  LAMBDA_KD: 0.02
  ALPHA: 1.0
  BETA: 0.8
  TEMPERATURE: 4.0
  AUX_LOSS_WEIGHT: 0.5 # V22 change: weaker SRD pull; focus on adapting local part branch.

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 40 # V22 change: short finetune, inspect early epochs instead of running full 120.
  BASE_LR: 0.00003 # V22 change: higher than previous tiny finetune so new local layers can learn.
  WARMUP_EPOCHS: 5
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 1
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: '../log/transreid/rgbnt201/vit_base_ics_rgb_srd_dual_ngtse_V22'
