MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '../model/vit_base_ics_cfs_lup.pth'
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on' # V1: off
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  STEM_CONV: True
  DROP_PATH: 0.1 # V1: 0.1 default
  DROP_OUT: 0.05 # V1: 0.0 default
  ATT_DROP_RATE: 0.0 # V1: 0.0 default
  DROPOUT_RATE: 0.1 # V1: 0.0 default
  EXTRA_DROP_PATH: False
  DUAL_BRANCH: False
  NGTSE: False

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('rgbnt201_rgb')
  ROOT_DIR: ('../data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

DISTILL:
  ENABLED: True
  DARK_ROOT: '../data/Syn_dark_market_msmt_v3'
  GT_ROOT: '../data/Syn_dark_market_msmt_v3_GT'
  TEACHER_WEIGHT: '../log/transreid/srd_teacher/vit_base_ics_gt/transformer_best.pth'
  LAMBDA_KD: 0.02 # V1: 0.02
  ALPHA: 1.0
  BETA: 0.8
  TEMPERATURE: 4.0
  AUX_LOSS_WEIGHT: 0.9 # V1: 1.0

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 80 # V1: 120; best was around 50-60
  BASE_LR: 0.0003 # V1: 0.0004
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5 # V1: 10
  LOG_PERIOD: 50
  EVAL_PERIOD: 5 # V1: 10
  WEIGHT_DECAY:  2e-4 # V1: 1e-4
  WEIGHT_DECAY_BIAS: 2e-4 # V1: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: '../log/transreid/rgbnt201/vit_base_ics_rgb_srd_V2'
